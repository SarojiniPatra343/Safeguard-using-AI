spring.application.name=safeguard
server.port=${PORT:8080}

# Empty default lets SafeGuard run in rules-only mode when no API key is configured.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never
